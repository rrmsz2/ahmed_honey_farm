version: '3.8'

services:
  honey-farm:
    build:
      context: .
      dockerfile: Dockerfile
    image: honey-farm-app
    container_name: honey-farm
    ports:
      - "3003:3003"
    volumes:
      - honey-data:/data/db
      - ./logs:/var/log/supervisor
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://localhost:27017
      - DB_NAME=honey_farm_db
      - CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  honey-data:
    name: honey-farm-data
